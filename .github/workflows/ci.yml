name: CI

# Checks every push and pull request: lint, type-check, tests, and a trial
# packaging run. Nothing is published from this workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS because the extension targets macOS and the tests run inside VS Code.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA so a moved tag cannot change
      # what runs. Dependabot keeps the SHAs and version comments up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package --out open-in-dinkus.vsix
      - run: npx vsce ls
