name: Publish

# Publishes to the Visual Studio Marketplace when a GitHub release is
# published. Authentication uses Marketplace Trusted Publishing (OIDC): GitHub
# proves to the Marketplace which repository and workflow is running, so no
# token or password is stored anywhere. See DEVELOPMENT.md for the one-time
# setup. The file name of this workflow is part of that setup; renaming it
# breaks publishing until the Marketplace policy is updated.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token used to publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache here: a release build should not reuse files
          # that an earlier workflow run saved.
      - run: npm ci
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - run: npm test
      - run: npx vsce publish --oidc
